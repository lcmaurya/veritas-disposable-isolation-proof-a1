# SOURCE-ONLY CANDIDATE; NOT COMMITTED, NOT EXECUTED.
# Public disposable hosted runner; no checkout, no tokens, no model weights.
name: VERITAS isolated package-import smoke A1
'on':
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Exact public disposable repository identity
        required: true
        type: string
permissions: {}
jobs:
  import-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Repository and manual-dispatch guard
        env:
          EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'lcmaurya/veritas-disposable-isolation-proof-a1' ]] || exit 31
          [[ "$EXPECTED_REPOSITORY" == 'lcmaurya/veritas-disposable-isolation-proof-a1' ]] || exit 32
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_RUN_ATTEMPT" == '1' ]] || exit 33
          [[ "$RUNNER_OS" == 'Linux' && "$RUNNER_ARCH" == 'X64' ]] || exit 34
          echo 'PUBLIC_DISPOSABLE_SCOPE=PASS'
      - name: Prepare trusted Python 3.12 downloader (no package execution)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Acquire hash-pinned candidate wheels as inert bytes
        shell: bash
        env:
          VERITAS_EXPECTED_WHEEL_MAP: '{"certifi-2026.10.23-py3-none-any.whl":"e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1","charset_normalizer-3.5.2-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl":"3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649","filelock-4.2.6-py3-none-any.whl":"fd7d4fca497bf3e3d0945a13261f8e684f2aef12ce7cf76aef26e13bf7388b88","fsspec-2026.9.0-py3-none-any.whl":"8dd6e646e99ea382bd85f97a45e6b526a442d79423a7dc673f1e2756d05fcb5f","huggingface_hub-0.24.7-py3-none-any.whl":"a212c555324c8a7b1ffdd07266bb7e7d69ca71aa238d27b7842d65e9a26ac3e5","idna-3.20-py3-none-any.whl":"ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c","jinja2-3.1.6-py3-none-any.whl":"85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67","markupsafe-3.0.4-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl":"8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581","mpmath-1.3.0-py3-none-any.whl":"a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c","networkx-3.7-py3-none-any.whl":"e3fd2c13a7814cee3746340d8d7f8598a67f16a58bf47fb7f8793fab6efca1b0","numpy-1.26.4-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl":"675d61ffbfa78604709862923189bad94014bef562cc35cf61d3a07bba02a7ed","packaging-26.3-py3-none-any.whl":"d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c","protobuf-4.25.5-cp37-abi3-manylinux2014_x86_64.whl":"fe14e16c22be926d3abfcb500e60cab068baf10b542b8c858fa27e098123e331","pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl":"ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc","regex-2026.9.29-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl":"39ab5894d971f9ac68baa6eca5c50387db579cfcacf36ae8df3feceb1815e6d0","requests-2.34.2-py3-none-any.whl":"2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0","safetensors-0.4.5-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl":"3685ce7ed036f916316b567152482b7e959dc754fcc4a8342333d222e05f407c","sentencepiece-0.2.0-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl":"f295105c6bdbb05bd5e1b0cafbd78ff95036f5d3641e7949455a3f4e5e7c3109","setuptools-84.2.1-py3-none-any.whl":"ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2","sympy-1.13.3-py3-none-any.whl":"54612cf55a62755ee71824ce692986f23c88ffa77207b30c1368eda4a7060f73","tokenizers-0.19.1-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl":"7c9d5b6c0e7a1e979bec10ff960fae925e947aab95619a6fdb4c1d8ff3708ce3","torch-2.10.0+cpu-cp312-cp312-manylinux_2_28_x86_64.whl":"ee40b8a4b4b2cf0670c6fd4f35a7ef23871af956fecb238fbf5da15a72650b1d","tqdm-4.70.1-py3-none-any.whl":"c293e525e6fef9c20e8728fd4612df02a0aa31bb5fe91ecd93e123b1b7bffa73","transformers-4.44.2-py3-none-any.whl":"1c02c65e7bfa5e52a634aff3da52138b583fc6f263c1f28d547dc144ba3d412d","typing_extensions-4.16.0-py3-none-any.whl":"481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8","urllib3-2.8.0-py3-none-any.whl":"0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3"}'
        run: |
          set -euo pipefail
          [[ "$(python -c 'import sys;print(sys.version_info[:2] == (3, 12))')" == 'True' ]] || exit 41
          work="$RUNNER_TEMP/veritas-import-a1-$GITHUB_RUN_ID"
          [[ ! -e "$work" ]] || exit 42
          mkdir -m 700 "$work"
          mkdir -m 700 "$work/wheels"
          cat > "$work/requirements.txt" <<'REQ'
          certifi==2026.10.23
          charset-normalizer==3.5.2
          filelock==4.2.6
          fsspec==2026.9.0
          huggingface-hub==0.24.7
          idna==3.20
          Jinja2==3.1.6
          MarkupSafe==3.0.4
          mpmath==1.3.0
          networkx==3.7
          numpy==1.26.4
          packaging==26.3
          protobuf==4.25.5
          PyYAML==6.0.3
          regex==2026.9.29
          requests==2.34.2
          safetensors==0.4.5
          sentencepiece==0.2.0
          setuptools==84.2.1
          sympy==1.13.3
          tokenizers==0.19.1
          torch==2.10.0+cpu
          tqdm==4.70.1
          transformers==4.44.2
          typing_extensions==4.16.0
          urllib3==2.8.0
          REQ
          python -m pip download --no-cache-dir --no-deps --only-binary=:all: \
            --python-version 3.12 --implementation cp --abi cp312 \
            --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 --platform linux_x86_64 \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --dest "$work/wheels" -r "$work/requirements.txt"
          cat > "$work/verify.py" <<'VERIFY'
          import hashlib,json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]);assert p.is_dir()
          expected=json.loads(os.environ['VERITAS_EXPECTED_WHEEL_MAP'])
          files={x.name:x for x in p.iterdir()}
          if set(files)!=set(expected):raise SystemExit('BLOCKED:WHEEL_MEMBERSHIP_MISMATCH')
          for n in sorted(expected):
              h=hashlib.sha256()
              with open(files[n],'rb') as f:
                  for part in iter(lambda:f.read(1024*1024),b''):h.update(part)
              if h.hexdigest()!=expected[n]:raise SystemExit('BLOCKED:WHEEL_SHA256_MISMATCH:'+n)
          print('WHEEL_BYTES_IDENTITY=26/26_PASS')
          VERIFY
          python -I -S "$work/verify.py" "$work/wheels"
          cat > "$work/check.py" <<'CHECK'
          import os,sys,resource
          from pathlib import Path
          
          def require(x,name):
              if not x:raise SystemExit('BLOCKED:'+name)
          
          def guard():
              require(sys.version_info[:2]==(3,12),'PYTHON_312')
              require(os.getuid()==65534 and os.geteuid()==65534,'NONROOT')
              info={x.split(':',1)[0]:x.split(':',1)[1].strip() for x in Path('/proc/self/status').read_text().splitlines() if ':' in x}
              require(info.get('NoNewPrivs')=='1','NO_NEW_PRIVILEGES')
              require(info.get('Seccomp')=='2','SECCOMP')
              require(all(int(info.get(c,'f'),16)==0 for c in ('CapEff','CapPrm','CapBnd')),'CAPS_DROPPED')
              require(bool(os.statvfs('/').f_flag & os.ST_RDONLY),'READONLY_ROOT')
              require(not any(Path(p).exists() for p in ('/home/runner','/github/workspace','/var/run/docker.sock','/run/secrets')),'HOST_PATH_DENIAL')
              require(set(os.listdir('/sys/class/net'))=={'lo'},'NO_EXTERNAL_NETWORK_INTERFACE')
              cg=Path('/sys/fs/cgroup')
              m=int((cg/'memory.max').read_text().strip())
              require(0<m<=4*1024**3,'MEMORY_CAP')
              n=int((cg/'pids.max').read_text().strip())
              require(1<n<=64,'PID_CAP')
              q,p=(cg/'cpu.max').read_text().split()
              require(q!='max' and 0<int(q)/int(p)<=1,'CPU_CAP')
              fds=[]
              for name in os.listdir('/proc/self/fd'):
                  try:os.fstat(int(name));fds.append(int(name))
                  except OSError:pass
              require(set(fds)<=set((0,1,2)),'EXTRA_INHERITED_FD')
              require('GITHUB_TOKEN' not in os.environ and 'AWS_ACCESS_KEY_ID' not in os.environ,'NO_CREDENTIALS')
              print('RESTRICTED_IMPORT_CHILD_GUARDS=PASS')
          
          if __name__=='__main__':
              guard()
              if sys.argv[1]=='preflight':
                  print('CHILD_PREFLIGHT=PASS_NO_PACKAGE_IMPORT')
              elif sys.argv[1]=='imports':
                  require(sys.flags.isolated and sys.flags.no_site,'INTERPRETER_ISOLATED')
                  sys.path.insert(0,'/tmp/site')
                  import numpy,torch,transformers,tokenizers,sentencepiece,safetensors,sympy,huggingface_hub
                  from transformers import BertModel,XLMRobertaTokenizer
                  assert torch.__version__=='2.10.0+cpu',torch.__version__
                  assert numpy.__version__=='1.26.4',numpy.__version__
                  assert transformers.__version__=='4.44.2',transformers.__version__
                  assert sympy.__version__=='1.13.3',sympy.__version__
                  assert tokenizers.__version__=='0.19.1',tokenizers.__version__
                  assert sentencepiece.__version__=='0.2.0',sentencepiece.__version__
                  assert safetensors.__version__=='0.4.5',safetensors.__version__
                  print('IMPORT_ONLY_SMOKE=PASS')
                  print('NO_MODEL_WEIGHTS_NO_MODEL_INSTANCE_NO_TRAINING=PASS')
              else:raise SystemExit('BLOCKED:UNKNOWN_MODE')
          CHECK
          chmod 444 "$work/wheels"/*.whl "$work/check.py" "$work/requirements.txt"
          chmod 555 "$work/wheels"
          image=python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
          docker pull --platform linux/amd64 "$image" >/dev/null
          # Only a public Docker Hub image is used; no repository checkout or secrets.
          docker image inspect "$image" --format '{{.Id}} {{.Architecture}}'
          # Wheels are read-only. Rootfs is read-only. Only /tmp is writable.
          timeout 240 docker run --pull=never --rm \
            --user 65534:65534 --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges=true --cgroupns private \
            --cpus 1 --memory 4g --memory-swap 4g --pids-limit 64 \
            --ulimit nofile=256:256 --ulimit core=0:0 --shm-size 16m \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,src=$work/wheels,dst=/wheels,readonly" \
            --mount "type=bind,src=$work/requirements.txt,dst=/requirements.txt,readonly" \
            --mount "type=bind,src=$work/check.py,dst=/check.py,readonly" \
            --env PYTHONNOUSERSITE=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 --env PIP_NO_CACHE_DIR=1 \
            --env PIP_CONFIG_FILE=/dev/null --env HOME=/tmp \
            "$image" /bin/sh -euc '
              python -I -S /check.py preflight
              python -m pip install --no-index --no-deps --no-cache-dir \
                --target /tmp/site /wheels/*.whl
              python -I -S /check.py imports
            '
          echo 'BOUNDARY=IMPORT_ONLY_SOURCE_NO_MODEL_NO_TRAINING'
